
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Email | Workflow AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light min-vh-100 d-flex align-items-center justify-content-center p-3">
    <div class="bg-white rounded-4 shadow-sm p-5 text-center" style="max-width:480px;">
        <div style="font-size:45px;">📩</div>
        <h3 class="fw-bold mt-3">Check Your Email</h3>
        <p class="text-secondary mt-3">
            If an account exists with that email address, a password-reset link has been sent.
            Please check your inbox.
        </p>
        <a href="{% url 'login' %}" class="btn btn-primary mt-3">
            Back to Login
        </a>
    </div>
</body>
</html>
