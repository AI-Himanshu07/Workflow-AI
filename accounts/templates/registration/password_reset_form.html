
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password | Workflow AI</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            background: #f5f6ff;
            font-family: Arial, sans-serif;
            color: #252447;
        }
        .reset-card {
            width: 100%;
            max-width: 440px;
            padding: 38px;
            background: white;
            border: 1px solid #ecebfa;
            border-radius: 20px;
            box-shadow: 0 15px 45px rgba(60, 50, 130, .09);
        }
        .brand { color: #6255c7; font-size: 23px; font-weight: 800; }
        .form-control { padding: 13px; border-radius: 10px; }
        .btn-purple {
            width: 100%;
            padding: 12px;
            background: #7164d9;
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
        }
        .btn-purple:hover { background: #5c50bd; color: white; }
    </style>
</head>
<body>
    <div class="reset-card">
        <div class="brand mb-4">Workflow AI</div>
        <h3 class="fw-bold mb-2">Forgot your password?</h3>
        <p class="text-secondary mb-4">
            Enter your registered email address. We'll send you a link to reset your password.
        </p>

        <form method="POST">
            {% csrf_token %}

            <label class="form-label fw-semibold" for="id_email">Email Address</label>
            <input
                type="email"
                name="email"
                id="id_email"
                class="form-control mb-4"
                placeholder="Enter your registered email"
                autocomplete="email"
                required
            >

            <button type="submit" class="btn-purple">
                Send Reset Link
            </button>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'login' %}" class="text-decoration-none" style="color:#6255c7;">
                ← Back to Login
            </a>
        </div>
    </div>
</body>
</html>
