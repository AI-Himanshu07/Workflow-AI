
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Your Email | Workflow AI</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eef2ff, #f5f0ff, #eaf5ff);
        }

        .success-card {
            width: 100%;
            max-width: 440px;
            padding: 40px 35px;
            background: white;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 15px 45px rgba(70, 75, 130, 0.12);
        }

        .logo {
            color: #6558d3;
            font-size: 25px;
            font-weight: 800;
            margin-bottom: 30px;
        }

        .success-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 22px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: #e9f8ef;
            color: #239b59;
            font-size: 35px;
        }

        h2 {
            color: #252943;
            font-size: 24px;
            font-weight: 750;
            margin-bottom: 13px;
        }

        p {
            color: #777b91;
            font-size: 14px;
            line-height: 1.8;
            margin-bottom: 25px;
        }

        .back-link {
            display: inline-block;
            padding: 12px 25px;
            border-radius: 11px;
            background: linear-gradient(135deg, #7165df, #8d7bea);
            color: white;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.2s;
        }

        .back-link:hover {
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 7px 18px rgba(113, 101, 223, 0.25);
        }

        .note {
            margin-top: 22px;
            font-size: 12px;
            color: #9295a8;
        }
    </style>
</head>

<body>

    <div class="success-card">

        <div class="logo">Workflow AI</div>

        <div class="success-icon">✓</div>

        <h2>Check Your Email</h2>

        <p>
            If an account exists with the email address you entered,
            password reset instructions have been sent.

            Please check your inbox and follow the instructions
            to create a new password.
        </p>

        <a href="{% url 'login' %}" class="back-link">
            Back to Login
        </a>

        <div class="note">
            Didn't receive the email? Check your spam folder.
        </div>

    </div>

</body>
</html>
