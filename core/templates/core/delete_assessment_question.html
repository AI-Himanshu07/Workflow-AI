<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Delete Question | Workflow AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-6">

            <div class="card border-0 shadow-sm">

                <div class="card-body p-5 text-center">

                    <div class="display-5 mb-3">
                        ⚠️
                    </div>

                    <h2 class="fw-bold">
                        Delete Question?
                    </h2>

                    <p class="text-muted mt-3">

                        Are you sure you want to delete this
                        assessment question?

                    </p>


                    <div class="alert alert-light border text-start">

                        {{ question.question }}

                    </div>


                    <form method="POST">

                        {% csrf_token %}


                        <button
                            type="submit"
                            class="btn btn-danger px-4 me-2"
                        >
                            Yes, Delete
                        </button>


                        <a
                            href="{% url 'manage_assessment_questions' question.job.id %}"
                            class="btn btn-outline-secondary"
                        >
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
