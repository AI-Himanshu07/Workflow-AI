<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Assessment Not Available | Workflow AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-7">

            <div class="card border-0 shadow-sm text-center">

                <div class="card-body p-5">

                    <div class="display-4 mb-3">
                        📝
                    </div>

                    <h2 class="fw-bold">
                        Assessment Not Available
                    </h2>

                    <p class="text-muted mt-3">

                        The company has not added any assessment
                        questions for this job yet.

                    </p>

                    <p class="fw-semibold">

                        {{ job.title }}

                    </p>


                    <a
                        href="{% url 'student_job_detail' job.id %}"
                        class="btn btn-primary px-4"
                    >
                        Back to Job

                    </a>

                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
