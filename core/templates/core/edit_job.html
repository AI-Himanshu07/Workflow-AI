<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Edit Job - Workflow AI</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

</head>


<body class="bg-light">


<!-- Navigation -->

<nav class="navbar navbar-expand-lg bg-white border-bottom">

    <div class="container">

        <a
            class="navbar-brand fw-bold"
            href="/"
        >
            Workflow AI
        </a>


        <div>

            <a
                href="/company/jobs/"
                class="btn btn-outline-success me-2"
            >
                My Jobs
            </a>


            <a
                href="/accounts/logout/"
                class="btn btn-outline-danger"
            >
                Logout
            </a>

        </div>

    </div>

</nav>


<!-- Edit Job -->

<div class="container py-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm border-0">

                <div class="card-body p-4 p-md-5">


                    <h1 class="fw-bold mb-2">
                        Edit Job
                    </h1>


                    <p class="text-muted mb-4">
                        Update the information for this job opportunity.
                    </p>


                    <form method="POST">

                        {% csrf_token %}


                        <!-- Job Title -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Job Title
                            </label>

                            <input
                                type="text"
                                name="title"
                                class="form-control"
                                value="{{ job.title }}"
                                required
                            >

                        </div>


                        <!-- Description -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Job Description
                            </label>

                            <textarea
                                name="description"
                                class="form-control"
                                rows="5"
                                required
                            >{{ job.description }}</textarea>

                        </div>


                        <!-- Location -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Location
                            </label>

                            <input
                                type="text"
                                name="location"
                                class="form-control"
                                value="{{ job.location }}"
                                required
                            >

                        </div>


                        <!-- Job Type -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Job Type
                            </label>

                            <select
                                name="job_type"
                                class="form-select"
                                required
                            >

                                <option
                                    value="full_time"
                                    {% if job.job_type == "full_time" %}
                                        selected
                                    {% endif %}
                                >
                                    Full Time
                                </option>


                                <option
                                    value="part_time"
                                    {% if job.job_type == "part_time" %}
                                        selected
                                    {% endif %}
                                >
                                    Part Time
                                </option>


                                <option
                                    value="internship"
                                    {% if job.job_type == "internship" %}
                                        selected
                                    {% endif %}
                                >
                                    Internship
                                </option>


                                <option
                                    value="contract"
                                    {% if job.job_type == "contract" %}
                                        selected
                                    {% endif %}
                                >
                                    Contract
                                </option>

                            </select>

                        </div>


                        <!-- Salary -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Salary
                            </label>

                            <input
                                type="text"
                                name="salary"
                                class="form-control"
                                value="{{ job.salary }}"
                            >

                        </div>


                        <!-- Required Degree -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Required Degree
                            </label>

                            <input
                                type="text"
                                name="required_degree"
                                class="form-control"
                                value="{{ job.required_degree }}"
                            >

                        </div>


                        <!-- Minimum CGPA -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Minimum CGPA
                            </label>

                            <input
                                type="number"
                                name="minimum_cgpa"
                                class="form-control"
                                step="0.01"
                                min="0"
                                max="10"
                                value="{{ job.minimum_cgpa }}"
                            >

                        </div>


                        <!-- Required Skills -->

                        <div class="mb-3">

                            <label class="form-label fw-bold">
                                Required Skills
                            </label>

                            <textarea
                                name="required_skills"
                                class="form-control"
                                rows="3"
                            >{{ job.required_skills }}</textarea>

                        </div>


                        <!-- Application Deadline -->

                        <div class="mb-4">

                            <label class="form-label fw-bold">
                                Application Deadline
                            </label>

                            <input
                                type="date"
                                name="application_deadline"
                                class="form-control"
                                value="{{ job.application_deadline|date:'Y-m-d' }}"
                            >

                        </div>


                        <!-- Buttons -->

                        <div class="d-flex gap-2">

                            <button
                                type="submit"
                                class="btn btn-success"
                            >
                                Save Changes
                            </button>


                            <a
                                href="/company/jobs/{{ job.id }}/"
                                class="btn btn-secondary"
                            >
                                Cancel
                            </a>

                        </div>


                    </form>


                </div>

            </div>

        </div>

    </div>

</div>


</body>

</html>
